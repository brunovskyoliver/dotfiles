# Small tmux setup. Session picker customization lives in .tmux.conf.local.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -s escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 10000

# Number windows from 1 and close gaps when windows are removed.
set -g base-index 1
set -g renumber-windows on
set -s set-clipboard on

# A plain status line with the session name and the standard window list.
set -g status-style "fg=default,bg=default"
set -g status-left "[#S] "
set -g status-right ""

source-file -q ~/.tmux.conf.local
